<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曙光咖啡厅 - 用户登录</title>
  <!-- 引入Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
  
  <!-- 配置Tailwind自定义主题 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            coffee: {
              light: '#E8DCCA',
              DEFAULT: '#C8A985',
              dark: '#8B5A2B',
              darker: '#5D4037'
            },
            cream: '#F5F5DC',
            accent: '#D2B48C'
          },
          fontFamily: {
            inter: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
  
  <!-- 自定义工具类 -->
  <style type="text/tailwindcss">
    @layer utilities {
      .input-focus {
        @apply focus:border-coffee-dark focus:ring-2 focus:ring-coffee/30 focus:outline-none;
      }
      .card-shadow {
        @apply shadow-lg shadow-coffee/20;
      }
      .btn-hover {
        @apply hover:bg-coffee-dark hover:-translate-y-0.5 transition-all duration-300;
      }
    }
  </style>
  
  <style>
    /* 全局样式 */
    body {
      background-image: linear-gradient(120deg, #fdfbfb 0%, #f8e8d3 100%);
      background-attachment: fixed;
    }
    
    /* 输入框动画 */
    .form-input {
      transition: all 0.3s ease;
    }
    
    /* 加载动画 */
    .loader {
      border-top-color: #8B5A2B;
      animation: spinner 0.8s linear infinite;
    }
    
    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* 页面入场动画 */
    .fade-in {
      animation: fadeIn 0.8s ease-in-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="font-inter min-h-screen flex flex-col items-center justify-center p-4 md:p-8">
  <!-- 主容器 -->
  <div class="w-full max-w-md fade-in">
    <!-- 品牌标识 -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-2xl mb-4 shadow-md overflow-hidden border-2 border-coffee">
        <img src="/static/images/icon.jpg" alt="曙光咖啡厅" class="w-full h-full object-cover">
      </div>
      <h1 class="text-[clamp(1.8rem,4vw,2.5rem)] font-bold text-coffee-darker mb-2">曙光咖啡厅</h1>
      <p class="text-gray-600">欢迎回来 · 享受香醇时刻</p>
    </div>
    
    <!-- 登录卡片 -->
    <div class="bg-white rounded-2xl p-6 md:p-8 card-shadow">
      <h2 class="text-xl font-semibold text-coffee-darker mb-6 text-center">用户登录</h2>
      
      <!-- 登录表单 -->
      <form id="loginForm" class="space-y-4">
        <!-- 学号输入 -->
        <div>
          <label for="studentNumber" class="block text-sm font-medium text-gray-700 mb-1">学号</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa fa-graduation-cap"></i>
            </span>
            <input type="text" id="studentNumber" name="studentNumber" 
                  class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg form-input input-focus"
                  placeholder="请输入您的学号" required>
          </div>
        </div>
        
        <!-- 密码输入 -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">密码</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa fa-lock"></i>
            </span>
            <input type="password" id="password" name="password" 
                  class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg form-input input-focus"
                  placeholder="请输入您的密码" required>
          </div>
        </div>
        
        <!-- 提交按钮 -->
        <button type="submit" id="submitBtn" 
                class="w-full bg-coffee text-white font-medium py-3 px-4 rounded-lg btn-hover flex items-center justify-center">
          <span>立即登录</span>
          <i class="fa fa-sign-in ml-2"></i>
        </button>
      </form>
      
      <!-- 登录成功提示 (默认隐藏) -->
      <div id="successMessage" class="hidden mt-6 p-4 bg-green-50 border border-green-200 rounded-lg text-center">
        <div class="flex flex-col items-center">
          <i class="fa fa-check-circle text-green-500 text-3xl mb-2"></i>
          <h3 class="font-semibold text-green-700">登录成功！</h3>
          <p id="welcomeUser" class="text-green-600 text-sm mt-1">欢迎回来，xxx</p>
          <button id="homeBtn" class="mt-4 px-4 py-2 bg-coffee text-white rounded-lg text-sm btn-hover">
            前往订餐
          </button>
        </div>
      </div>
      
      <!-- 加载状态 (默认隐藏) -->
      <div id="loadingState" class="hidden mt-6 p-6 text-center">
        <div class="inline-block w-10 h-10 border-4 border-gray-200 rounded-full loader mb-3"></div>
        <p class="text-gray-600">正在验证信息...</p>
      </div>
    </div>
    
    <!-- 没有账号 -->
    <div class="text-center mt-6 text-gray-600 text-sm">
      还没有账号？<a href="/register" class="text-coffee hover:text-coffee-dark font-medium transition-colors">立即注册</a>
    </div>
    
    <!-- 页脚 -->
    <footer class="mt-12 text-center text-gray-500 text-xs">
      <p>© 2025 曙光咖啡厅 版权所有</p>
    </footer>
  </div>

  <!-- JavaScript -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('loginForm');
      const submitBtn = document.getElementById('submitBtn');
      const successMessage = document.getElementById('successMessage');
      const loadingState = document.getElementById('loadingState');
      const welcomeUser = document.getElementById('welcomeUser');
      const homeBtn = document.getElementById('homeBtn');
      
      // 表单提交处理
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // 显示加载状态
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
        loadingState.classList.remove('hidden');
        successMessage.classList.add('hidden');
        
        // 收集表单数据
        const formData = {
          student_number: document.getElementById('studentNumber').value,
          password: document.getElementById('password').value
        };
        
        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(formData)
          });
          
          const result = await response.json();
          
          if (response.ok) {
            // 登录成功
            console.log('登录成功:', result);
            
            // 保存用户信息到本地
            localStorage.setItem('currentUser', JSON.stringify(result.user));
            
            // 显示成功信息，隐藏表单和加载状态
            loginForm.classList.add('hidden');
            loadingState.classList.add('hidden');
            successMessage.classList.remove('hidden');
            welcomeUser.textContent = `欢迎回来，${result.user.name}`;
            
            // 2秒后自动跳转
            setTimeout(() => {
              window.location.href = '/menu';
            }, 2000);
          } else {
            throw new Error(result.detail || '登录失败，请检查学号和密码');
          }
        } catch (error) {
          submitBtn.disabled = false;
          submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
          loadingState.classList.add('hidden');
          alert(error.message);
        }
      });
      
      homeBtn.addEventListener('click', () => {
        window.location.href = '/menu';
      });
    });
  </script>
</body>
</html>
