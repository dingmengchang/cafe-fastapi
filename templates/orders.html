<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>曙光咖啡厅 - 订单管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            light: '#E8DCCA',
                            DEFAULT: '#C8A985',
                            dark: '#8B5A2B',
                            darker: '#5D4037'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm px-4 py-3 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img src="/static/images/icon.jpg" alt="Logo" class="w-10 h-10 rounded-xl">
                <h1 class="text-xl font-bold text-coffee-darker">订单管理系统</h1>
            </div>
            <button onclick="window.location.href='/menu'" class="text-gray-600 hover:text-coffee-dark transition-colors">
                <i class="fa fa-arrow-left mr-1"></i>返回菜单
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-8">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold text-gray-800">所有订单</h2>
            <button onclick="loadOrders()" class="bg-coffee text-white px-4 py-2 rounded-lg hover:bg-coffee-dark transition-all">
                <i class="fa fa-refresh mr-1"></i>刷新数据
            </button>
        </div>

        <div id="ordersContainer" class="space-y-6">
            <!-- 订单列表动态加载 -->
            <div class="text-center py-20 text-gray-400">
                <i class="fa fa-spinner fa-spin text-3xl mb-4"></i>
                <p>正在加载订单数据...</p>
            </div>
        </div>
    </main>

    <script>
        async function loadOrders() {
            const container = document.getElementById('ordersContainer');
            try {
                const response = await fetch('/api/admin/orders');
                const orders = await response.json();
                
                if (orders.length === 0) {
                    container.innerHTML = `
                        <div class="bg-white rounded-2xl p-12 text-center shadow-sm border border-gray-100">
                            <i class="fa fa-folder-open-o text-5xl text-gray-200 mb-4"></i>
                            <p class="text-gray-500">暂无订单数据</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = orders.reverse().map(order => `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden transition-all hover:shadow-md">
                        <div class="p-6 border-b border-gray-50 flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div class="flex items-center space-x-4">
                                <div class="w-12 h-12 bg-coffee/10 rounded-xl flex items-center justify-center text-coffee-dark font-bold text-lg">
                                    #${order.id}
                                </div>
                                <div>
                                    <h3 class="font-bold text-gray-800">${order.user_name}</h3>
                                    <p class="text-gray-500 text-xs">${order.student_number} · ${order.created_at}</p>
                                </div>
                            </div>
                            <div class="flex items-center justify-between md:justify-end gap-6">
                                <div class="text-right">
                                    <p class="text-gray-400 text-[10px] uppercase tracking-wider">订单总额</p>
                                    <p class="text-xl font-bold text-coffee-dark">¥${order.total_price.toFixed(2)}</p>
                                </div>
                                <div class="px-3 py-1 rounded-full text-xs font-bold ${
                                    order.status === 'pending' ? 'bg-amber-100 text-amber-600' : 
                                    order.status === 'completed' ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-600'
                                }">
                                    ${order.status === 'pending' ? '待处理' : order.status === 'completed' ? '已完成' : '已取消'}
                                </div>
                            </div>
                        </div>
                        <div class="bg-gray-50/50 p-6">
                            <div class="space-y-3">
                                ${order.items.map(item => `
                                    <div class="flex justify-between items-center text-sm text-gray-600">
                                        <div class="flex items-center space-x-2">
                                            <span class="w-1.5 h-1.5 rounded-full bg-coffee-light"></span>
                                            <span>${item.name}</span>
                                        </div>
                                        <div class="font-medium">
                                            <span class="text-gray-400">x${item.quantity}</span>
                                            <span class="ml-4">¥${(item.price * item.quantity).toFixed(2)}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = `
                    <div class="bg-red-50 text-red-500 p-6 rounded-2xl text-center border border-red-100">
                        <i class="fa fa-exclamation-triangle mb-2 text-2xl"></i>
                        <p>加载订单失败，请检查登录状态</p>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (!user || user.role !== 'staff') {
                alert('权限不足，仅店员可访问此页面');
                window.location.href = '/menu';
                return;
            }
            loadOrders();
        });
    </script>
</body>
</html>
