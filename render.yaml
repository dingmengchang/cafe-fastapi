services:
  - type: web
    name: waimai-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: waimai-db
          property: connectionString

databases:
  - name: waimai-db
    plan: free
